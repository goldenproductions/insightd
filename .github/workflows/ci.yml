name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install frontend deps
        run: cd hub/src/web/frontend && npm ci

      - name: Build frontend
        run: cd hub/src/web/frontend && npm run build

      - run: npx tsc --noEmit

      - run: npm test
