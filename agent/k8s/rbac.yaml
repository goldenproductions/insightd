---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insightd-agent
  namespace: insightd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: insightd-agent
rules:
  # List pods on this node, read pod logs
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Read node info (used to verify connection at startup)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Access kubelet metrics endpoint
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats", "nodes/proxy"]
    verbs: ["get"]
  # Read ReplicaSets to walk pod owners up to their Deployment for stable naming
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  # Cluster-scoped PV/PVC + Service inventory (the elected leader publishes
  # to the hub). Services back the topology view's Ingress→Service→Workload
  # edges, replacing the heuristic name-matching in earlier versions.
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch"]
  # Cluster-scoped Warning events — the elected leader polls and publishes.
  # Events live on apiserver with ~1h TTL; no need for watch (we poll).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Cluster-scoped Ingress inventory — leader publishes to the hub for
  # auto-discovery. Existing deployments must re-apply this manifest.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: insightd-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: insightd-agent
subjects:
  - kind: ServiceAccount
    name: insightd-agent
    namespace: insightd
---
# Namespace-scoped Role for leader election via coordination.k8s.io Leases.
# Deliberately NOT a ClusterRole — the lease lives in insightd's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insightd-agent-lease
  namespace: insightd
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insightd-agent-lease
  namespace: insightd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: insightd-agent-lease
subjects:
  - kind: ServiceAccount
    name: insightd-agent
    namespace: insightd
